<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Աշխարհի Ժամացույց և Ժամային Տարբերություններ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
            color: #38bdf8;
        }

        .local-time-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 20px 30px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .local-time-card h2 {
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .local-time-card .time {
            font-size: 2.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin-top: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border-color: #475569;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .country-name {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .flag {
            font-size: 1.8rem;
        }

        .city-name {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .time-display {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #f1f5f9;
        }

        .date-display {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .diff-badge {
            align-self: flex-start;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .ahead {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .behind {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .same {
            background-color: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
    </style>
</head>
<body>

    <h1>🌍 Աշխարհի Ժամացույց</h1>

    <!-- Տեղական ժամանակ -->
    <div class="local-time-card">
        <h2>Ձեր տեղական ժամանակը</h2>
        <div class="time" id="localTime">00:00:00</div>
    </div>

    <!-- Քաղաքների ցանկ -->
    <div class="grid" id="clockGrid"></div>

    <script>
        // Քաղաքների ցանկը իրենց ժամային գոտիներով (Timezone) և դրոշներով
        const locations = [
            { country: "Հայաստան", city: "Երևան", flag: "🇦🇲", timezone: "Asia/Yerevan" },
            { country: "Վրաստան", city: "Թբիլիսի", flag: "🇬🇪", timezone: "Asia/Tbilisi" },
            { country: "Ռուսաստան", city: "Մոսկվա", flag: "🇷🇺", timezone: "Europe/Moscow" },
            { country: "Ֆրանսիա", city: "Փարիզ", flag: "🇫🇷", timezone: "Europe/Paris" },
            { country: "Մեծ Բրիտանիա", city: "Լոնդոն", flag: "🇬🇧", timezone: "Europe/London" },
            { country: "ԱՄՆ", city: "Նյու Յորք", flag: "🇺🇸", timezone: "America/New_York" },
            { country: "ԱՄՆ", city: "Լոս Անջելես", flag: "🇺🇸", timezone: "America/Los_Angeles" },
            { country: "Ճապոնիա", city: "Տոկիո", flag: "🇯🇵", timezone: "Asia/Tokyo" },
            { country: "ԱՄԷ", city: "Դուբայ", flag: "🇦🇪", timezone: "Asia/Dubai" },
            { country: "Ավստրալիա", city: "Սիդնեյ", flag: "🇦🇺", timezone: "Australia/Sydney" },
            { country: "Չինաստան", city: "Պեկին", flag: "🇨🇳", timezone: "Asia/Shanghai" },
            { country: "Բրազիլիա", city: "Սան Պաուլու", flag: "🇧🇷", timezone: "America/Sao_Paulo" }
        ];

        function updateClocks() {
            const now = new Date();

            // Թարմացնել տեղական ժամը
            document.getElementById('localTime').innerText = now.toLocaleTimeString('hy-AM');

            const grid = document.getElementById('clockGrid');
            grid.innerHTML = '';

            locations.forEach(loc => {
                // Ստանում ենք քաղաքի ընթացիկ ժամը
                const timeString = now.toLocaleTimeString('hy-AM', { timeZone: loc.timezone, hour12: false });
                const dateString = now.toLocaleDateString('hy-AM', { timeZone: loc.timezone, weekday: 'short', month: 'short', day: 'numeric' });

                // Հաշվում ենք ժամային տարբերությունը տեղական ժամանակից
                const localOffset = now.getTimezoneOffset();
                
                // Ստանում ենք target timezone-ի րոպեների տարբերությունը
                const targetDate = new Date(now.toLocaleString('en-US', { timeZone: loc.timezone }));
                const localDate = new Date(now.toLocaleString('en-US'));
                const diffInMinutes = Math.round((targetDate - localDate) / (1000 * 60));
                const diffInHours = diffInMinutes / 60;

                // Տեքստի ձևավորում տարբերության համար
                let diffText = "";
                let badgeClass = "";

                if (diffInHours === 0) {
                    diffText = "Նույն ժամն է";
                    badgeClass = "same";
                } else if (diffInHours > 0) {
                    const h = Math.floor(diffInHours);
                    const m = Math.abs(diffInMinutes % 60);
                    diffText = `+${h}${m > 0 ? ` ժ ${m} ր` : ' ժամ'} առաջ`;
                    badgeClass = "ahead";
                } else {
                    const h = Math.ceil(diffInHours);
                    const m = Math.abs(diffInMinutes % 60);
                    diffText = `${h}${m > 0 ? ` ժ ${m} ր` : ' ժամ'} հետ`;
                    badgeClass = "behind";
                }

                // Ստեղծում ենք քարտը
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="country-name">${loc.country}</span>
                            <span class="flag">${loc.flag}</span>
                        </div>
                        <div class="city-name">${loc.city}</div>
                        <div class="time-display">${timeString}</div>
                        <div class="date-display">${dateString}</div>
                    </div>
                    <div class="diff-badge ${badgeClass}">${diffText}</div>
                `;

                grid.appendChild(card);
            });
        }

        // Առաջին անգամ աշխատեցնել
        updateClocks();

        // Թարմացնել ամեն վայրկյան
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
